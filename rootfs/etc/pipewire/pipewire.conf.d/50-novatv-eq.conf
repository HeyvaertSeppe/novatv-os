# NovaTV equalizer: a virtual output ("NovaTV Equalizer") that every app plays into.
# It applies a preamp, a DJ-style 3-band isolator (low/mid/high) and a 10-band graphic EQ,
# then forwards the sound to the real output (TV over HDMI or a Bluetooth speaker).
# The NovaTV server changes the gains live with `pw-cli set-param`.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "NovaTV Equalizer"
      media.name       = "NovaTV Equalizer"
      filter.graph = {
        nodes = [
          { type = builtin name = pre  label = bq_highshelf control = { "Freq" = 0.0 "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = low  label = bq_lowshelf  control = { "Freq" = 220.0 "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin name = mid  label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin name = high label = bq_highshelf control = { "Freq" = 4500.0 "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin name = b1 label = bq_peaking control = { "Freq" = 31.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b2 label = bq_peaking control = { "Freq" = 62.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b3 label = bq_peaking control = { "Freq" = 125.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b4 label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b5 label = bq_peaking control = { "Freq" = 500.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b6 label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b7 label = bq_peaking control = { "Freq" = 2000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b8 label = bq_peaking control = { "Freq" = 4000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b9 label = bq_peaking control = { "Freq" = 8000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = b10 label = bq_peaking control = { "Freq" = 16000.0 "Q" = 1.41 "Gain" = 0.0 } }
        ]
        links = [
          { output = "pre:Out" input = "low:In" }
          { output = "low:Out" input = "mid:In" }
          { output = "mid:Out" input = "high:In" }
          { output = "high:Out" input = "b1:In" }
          { output = "b1:Out" input = "b2:In" }
          { output = "b2:Out" input = "b3:In" }
          { output = "b3:Out" input = "b4:In" }
          { output = "b4:Out" input = "b5:In" }
          { output = "b5:Out" input = "b6:In" }
          { output = "b6:Out" input = "b7:In" }
          { output = "b7:Out" input = "b8:In" }
          { output = "b8:Out" input = "b9:In" }
          { output = "b9:Out" input = "b10:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "novatv_eq"
        media.class = Audio/Sink
        priority.session = 2000
      }
      playback.props = {
        node.name    = "novatv_eq.output"
        node.passive = true
      }
    }
  }
]
