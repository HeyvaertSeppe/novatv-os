name: Build NovaTV image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    # native ARM runner for public repos (fast); private repos fall back to x86 + emulation
    runs-on: ${{ github.event.repository.private && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk e2fsprogs mtools xz-utils curl
          if [ "$(uname -m)" != "aarch64" ]; then sudo apt-get install -y qemu-user-static; fi

      - name: Build image
        run: sudo ./build/build-image.sh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: novatv-os-image
          path: out/*
          compression-level: 0

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
