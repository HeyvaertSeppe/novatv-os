name: Build NovaTV image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (creates tag v<version>)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    # native ARM runner for public repos (fast); private repos fall back to x86 + emulation
    runs-on: ${{ github.event.repository.private && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fdisk e2fsprogs mtools xz-utils curl
          if [ "$(uname -m)" != "aarch64" ]; then sudo apt-get install -y qemu-user-static; fi

      - name: Build image
        run: sudo ./build/build-image.sh

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: novatv-os-image
          path: out/*
          compression-level: 0

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: NovaTV OS ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Flashable image for the Raspberry Pi 5.

            1. Download `novatv-os-*.img.xz` below.
            2. Flash it to a microSD card (16 GB or more) with balenaEtcher or Raspberry Pi Imager
               (don't use Imager's OS customisation).
            3. Boot the Pi with a USB keyboard and mouse plugged in, and follow the setup on the TV.

            See the README for features, Widevine/DRM notes and troubleshooting.
          files: out/*
